apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenepick-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scenepick-app
  template:
    metadata:
      labels:
        app: scenepick-app
    spec:
      containers:
        - name: app
          image: soooii/scenepick-backend:placeholder
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
          envFrom:
            - secretRef:
                name: scenepick-app-secrets
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
      restartPolicy: Always
