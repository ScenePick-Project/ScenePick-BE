name: Deploy to k3s

on:
  push:
    branches:
      - test
      - dev
      - main

env:
  DOCKER_IMAGE: soooii/scenepick-backend
  IMAGE_TAG: ${{ github.sha }}
  K8S_DIR: k8s

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build Spring Boot
        run: ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}
          platforms: linux/arm64

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/scenepick.key
          chmod 600 ~/.ssh/scenepick.key

          cat > ~/.ssh/config << EOF
          Host bastion
            HostName ${{ secrets.BASTION_HOST }}
            User ${{ secrets.BASTION_USER }}
            IdentityFile ~/.ssh/scenepick.key
            StrictHostKeyChecking no

          Host master
            HostName ${{ secrets.MASTER_HOST }}
            User ${{ secrets.MASTER_USER }}
            IdentityFile ~/.ssh/scenepick.key
            ProxyJump bastion
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 20
          EOF

      - name: Deploy manifests to k3s
        run: |
          tar -czf k8s.tar.gz $K8S_DIR
          scp k8s.tar.gz master:/home/${{ secrets.MASTER_USER }}/k8s.tar.gz
          ssh master <<'EOF'
          set -e
          rm -rf ~/k8s
          mkdir -p ~/k8s
          tar -xzf ~/k8s.tar.gz -C ~
          sed -i "s|${{ env.DOCKER_IMAGE }}:placeholder|${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}|g" ~/k8s/deployment.yml
          kubectl apply -f - <<'SECRET'
          apiVersion: v1
          kind: Secret
          metadata:
            name: scenepick-app-secrets
            namespace: default
          type: Opaque
          stringData:
            DB_URL: "${{ secrets.DB_URL }}"
            DB_USERNAME: "${{ secrets.DB_USERNAME }}"
            DB_PASSWORD: "${{ secrets.DB_PASSWORD }}"
            AWS_ACCESS_KEY: "${{ secrets.AWS_ACCESS_KEY }}"
            AWS_SECRET_KEY: "${{ secrets.AWS_SECRET_KEY }}"
            S3_BUCKET_NAME: "${{ secrets.S3_BUCKET_NAME }}"
            GOOGLE_CLIENT_ID: "${{ secrets.GOOGLE_CLIENT_ID }}"
            GOOGLE_CLIENT_SECRET: "${{ secrets.GOOGLE_CLIENT_SECRET }}"
            KAKAO_CLIENT_ID: "${{ secrets.KAKAO_CLIENT_ID }}"
            KAKAO_CLIENT_SECRET: "${{ secrets.KAKAO_CLIENT_SECRET }}"
            NAVER_CLIENT_ID: "${{ secrets.NAVER_CLIENT_ID }}"
            NAVER_CLIENT_SECRET: "${{ secrets.NAVER_CLIENT_SECRET }}"
            JWT_SECRET: "${{ secrets.JWT_SECRET }}"
            TMDB_API_TOKEN: "${{ secrets.TMDB_API_TOKEN }}"
          SECRET
          kubectl apply -f ~/k8s/deployment.yml
          kubectl apply -f ~/k8s/service.yml

          if ! kubectl -n default rollout status deployment/scenepick-app --timeout=5m; then
            echo "Rollout failed — rolling back to previous version"
            kubectl -n default rollout undo deployment/scenepick-app
            if ! kubectl -n default rollout status deployment/scenepick-app --timeout=3m; then
              echo "Rollback also failed — manual intervention required"
            fi
            exit 1
          fi

          echo "Deployment successful"
          EOF
