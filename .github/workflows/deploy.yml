name: Deploy Dev to k3s

on:
  push:
    branches:
      - test

env:
  DOCKER_IMAGE: soooii/scenepick-backend
  K8S_DIR: k8s

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build Spring Boot
        run: ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:dev
          platforms: linux/amd64,linux/arm64

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/scenepick.key
          chmod 600 ~/.ssh/scenepick.key

          cat > ~/.ssh/config << EOF
          Host bastion
            HostName ${{ secrets.BASTION_HOST }}
            User ${{ secrets.BASTION_USER }}
            IdentityFile ~/.ssh/scenepick.key
            StrictHostKeyChecking no

          Host master
            HostName ${{ secrets.MASTER_HOST }}
            User ${{ secrets.MASTER_USER }}
            IdentityFile ~/.ssh/scenepick.key
            ProxyJump bastion
            StrictHostKeyChecking no
          EOF

      - name: Deploy manifests to k3s
        run: |
          tar -czf k8s.tar.gz $K8S_DIR
          scp k8s.tar.gz master:/home/${{ secrets.MASTER_USER }}/k8s.tar.gz
          ssh master <<'EOF'
          set -e
          rm -rf ~/k8s
          mkdir -p ~/k8s
          tar -xzf ~/k8s.tar.gz -C ~
          kubectl apply -f - <<'SECRET'
          apiVersion: v1
          kind: Secret
          metadata:
            name: scenepick-app-secrets
            namespace: default
          type: Opaque
          stringData:
            DB_URL: "${{ secrets.DB_URL }}"
            DB_USERNAME: "${{ secrets.DB_USERNAME }}"
            DB_PASSWORD: "${{ secrets.DB_PASSWORD }}"
            AWS_ACCESS_KEY: "${{ secrets.AWS_ACCESS_KEY }}"
            AWS_SECRET_KEY: "${{ secrets.AWS_SECRET_KEY }}"
            S3_BUCKET_NAME: "${{ secrets.S3_BUCKET_NAME }}"
            GOOGLE_CLIENT_ID: "${{ secrets.GOOGLE_CLIENT_ID }}"
            GOOGLE_CLIENT_SECRET: "${{ secrets.GOOGLE_CLIENT_SECRET }}"
            KAKAO_CLIENT_ID: "${{ secrets.KAKAO_CLIENT_ID }}"
            KAKAO_CLIENT_SECRET: "${{ secrets.KAKAO_CLIENT_SECRET }}"
            JWT_SECRET: "${{ secrets.JWT_SECRET }}"
            TMDB_API_TOKEN: "${{ secrets.TMDB_API_TOKEN }}"
          SECRET
          kubectl apply -f ~/k8s/deployment.yaml
          kubectl apply -f ~/k8s/service.yaml
          if kubectl -n default get service backend-service -o jsonpath='{.spec.selector.run}' | grep -q .; then
            kubectl -n default patch service backend-service --type=json -p='[{"op":"remove","path":"/spec/selector/run"}]'
          fi
          kubectl -n default rollout restart deployment/scenepick-app
          kubectl -n default rollout status deployment/scenepick-app
          EOF
