spring:
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  application:
    name: scene-pick-be-test

mybatis:
  mapper-locations: classpath:mybatis/mapper/**/*.xml
  type-aliases-package: com.project.scenepickbe
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

jwt:
  secret: ${JWT_SECRET:test-secret-key-for-testing-purposes-only-minimum-256-bits}
  access-expiration-minutes: 30
  refresh-expiration-days: 14
  cookie:
    secure: false

logging:
  level:
    com.project.scenepickbe: DEBUG
    org.springframework.jdbc: DEBUG
